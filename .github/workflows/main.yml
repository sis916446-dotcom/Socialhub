
name: Build SocialHub APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SocialHubAndroid_complete.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o SocialHubAndroid_complete.zip -d extracted
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: extracted/SocialHubAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SocialHub-APK
          path: extracted/SocialHubAndroid/app/build/outputs/apk/debug/app-debug.apk
